  function sync(m){var r=m.querySelector('[data-act=rest]'),s=m.querySelector('[data-act=slow]');
    if(r)r.setAttribute('aria-pressed',m.hasAttribute('data-frozen')?'true':'false');
    if(s)s.setAttribute('aria-pressed',m.getAttribute('data-slow')==='1'?'true':'false');}
  mocks.forEach(function(m){
    var rest=parseFloat(m.getAttribute('data-rest'));
    m.querySelector('[data-act=replay]').addEventListener('click',function(){anims(m).forEach(function(a){a.currentTime=0;});play(m);});
    m.querySelector('[data-act=rest]').addEventListener('click',function(){
      if(m.hasAttribute('data-frozen')){play(m);}else{m.setAttribute('data-frozen','');seek(m,rest);sync(m);}});
    m.querySelector('[data-act=slow]').addEventListener('click',function(){
      m.setAttribute('data-slow',m.getAttribute('data-slow')==='1'?'0':'1');
      anims(m).forEach(function(a){a.playbackRate=rate(m);});sync(m);});
    if(q){m.setAttribute('data-frozen','');seek(m,parseFloat(q));}
    else if(reduce){m.setAttribute('data-frozen','');seek(m,rest);}
    sync(m);
  });
  if(!q&&mocks.length>1&&'IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){var m=e.target;
      if(m.hasAttribute('data-frozen'))return;
      anims(m).forEach(function(a){if(e.isIntersecting){a.playbackRate=rate(m);a.play();}else{a.pause();}});});},{rootMargin:'120px 0px'});
    mocks.forEach(function(m){io.observe(m);});
  }
})();
</script></body></html>
