<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402">
<meta name="robots" content="noindex,nofollow">
<title>Take · 58 interactif</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="proto.css">
<style>
:root{ --tint-red:#FDECEA; --tint-green:#E8F5EE; --tint-gray:#F0F0F3; --thumb:#FFFFFF; --press:rgba(0,0,0,.05); }
:root[data-t="sombre"]{ --tint-red:#3A1714; --tint-green:#0F2E1D; --tint-gray:#242428; --thumb:#404046; --press:rgba(255,255,255,.08); }

/* Texte posé sur sa ligne de base, aux cotes des maquettes fixes (1 pt = 1 px) : --x, --y (ligne de base). */
.tx{ position:absolute; margin:0; white-space:nowrap; line-height:20px; left:calc(var(--x) * 1px); top:calc((var(--y) - var(--o)) * 1px); }
/* --o : où Chrome pose la ligne de base d'Inter dans une ligne de 20 px (mesuré), pour tomber pile sur --y. */
.s12{ font-size:12px; --o:14; } .s125{ font-size:12.5px; --o:14; } .s13{ font-size:13px; --o:15; } .s15{ font-size:15px; --o:15; } .s155{ font-size:15.5px; --o:15; }
.tx.m{ transform:translateX(-50%); } .tx.r{ transform:translateX(-100%); }
.w4{ font-weight:400; } .w5{ font-weight:500; } .w6{ font-weight:600; } .w7{ font-weight:700; }
.mu{ color:var(--muted); } .rd{ color:var(--red); } .gr{ color:var(--green); }

.q58{ position:absolute; left:18px; top:117px; margin:0; font-size:13px; line-height:18px; color:var(--muted); white-space:nowrap; }
.backhit{ position:absolute; left:14px; top:68.67px; width:36px; height:36px; border-radius:18px; border:0; padding:0; background:transparent; z-index:5;
  transition:background .15s; }
.backhit:active{ background:var(--press); }

.face{ position:absolute; display:block; border-radius:50%; pointer-events:none; }
.gface{ position:absolute; border-radius:50%; background:var(--tint-gray); color:var(--muted); display:grid; place-items:center; }
.gface .gh{ width:52%; height:52%; }

.pr, .anonline, .anonblock{ position:absolute; padding:0; border:0; background:transparent; text-align:left; isolation:isolate; }
.pr::before, .anonline::before, .anonblock::before{ content:""; position:absolute; inset:var(--hit, -6px); border-radius:14px; z-index:-1; transition:background .15s; }
.pr:active::before, .anonline:active::before, .anonblock:active::before{ background:var(--press); }
.anonline{ left:18px; width:366px; height:24px; --hit:-6px -8px; }
.anonline .gh{ position:absolute; left:0; top:4px; width:16px; height:16px; color:var(--muted); }

/* B · Deux colonnes */
.colhead{ position:absolute; top:175px; width:179px; height:36px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14.5px; padding-bottom:2px; box-sizing:border-box; }
.pr.b{ width:179px; height:40px; --hit:-6px -4px; }

/* C · Les visages */
.pr.c{ width:56px; height:78px; --hit:-5px -9px -6px; }
.pr.c:active .face{ transform:scale(.96); }
.pr.c .face{ transition:transform .12s; }
.anonblock{ left:18px; top:433px; width:366px; height:116px; --hit:-4px -8px -2px; }

/* D · Une seule liste */
.filters{ position:absolute; right:18px; top:169px; display:flex; gap:6px; }
.filters .pill{ height:30px; padding:0 12px; border-radius:15px; }
.dlist{ position:absolute; left:0; top:203px; width:402px; display:flex; flex-direction:column; }
.pr.d{ position:relative; flex:none; width:402px; height:60px; overflow:hidden; --hit:0; transition:height .28s cubic-bezier(.32,.72,0,1), opacity .2s; }
.pr.d::before{ border-radius:0; }
.pr.d.out{ height:0; opacity:0; }
.vote{ position:absolute; left:330px; top:13px; width:54px; height:26px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:13px; padding-bottom:2px; box-sizing:border-box; }
.vote.oui{ background:var(--tint-green); color:var(--green); } .vote.non{ background:var(--tint-red); color:var(--red); }

/* E · Deux onglets */
.etabs{ position:absolute; left:18px; top:175px; width:366px; height:38px; border-radius:19px; background:var(--tint-gray); }
.etabs .thumb{ position:absolute; left:183px; top:3px; width:180px; height:32px; border-radius:16px; background:var(--thumb);
  transition:transform .28s cubic-bezier(.32,.72,0,1); }
section[data-now="non"] .etabs .thumb{ transform:translateX(-180px); }
.etabs button{ position:absolute; top:0; height:38px; border:0; padding:0 0 2px; background:transparent; font-size:14px; font-weight:600; color:var(--muted);
  transition:color .2s; }
.etabs [data-side="non"]{ left:0; width:183px; } .etabs [data-side="oui"]{ left:183px; width:180px; }
.etabs button.on{ font-weight:700; }
.etabs [data-side="oui"].on{ color:var(--green); } .etabs [data-side="non"].on{ color:var(--red); }
.elist{ position:absolute; left:0; top:221px; width:402px; transition:opacity .2s .06s, transform .28s cubic-bezier(.32,.72,0,1); }
.elist:not(.on){ opacity:0; pointer-events:none; transition:opacity .12s, transform .28s cubic-bezier(.32,.72,0,1); }
.elist[data-list="non"]:not(.on){ transform:translateX(-28px); }
.elist[data-list="oui"]:not(.on){ transform:translateX(28px); }
.erow{ position:absolute; left:0; width:402px; height:64px; }
.pr.e{ left:0; top:0; width:290px; height:64px; --hit:0; }
.pr.e::before{ border-radius:0 14px 14px 0; }
.ebtn{ position:absolute; left:296px; top:16px; width:88px; height:32px; border-radius:16px; border:0; padding:0; background:var(--tint-gray); color:var(--text);
  font-weight:600; font-size:13.5px; transition:transform .12s; }
.ebtn:active{ transform:scale(.96); }
section[data-letter="E"] .anonline{ transition:transform .28s cubic-bezier(.32,.72,0,1); }
section[data-now="non"] .anonline{ transform:translateY(-192px); }

/* La fiche d'une personne */
#fiche{ gap:12px; }
#fiche .f-face{ justify-self:center; width:64px; height:64px; border-radius:32px; margin-top:4px; }
#fiche h3{ margin-top:-2px; }
#fiche .sub{ margin:-10px 0 0; }
#fiche .f-vote{ justify-self:center; margin:2px 0 0; height:30px; padding:0 14px; border-radius:15px; display:flex; align-items:center; font-weight:700; font-size:14px; }
#fiche .f-vote[data-camp="oui"]{ background:var(--tint-green); color:var(--green); }
#fiche .f-vote[data-camp="non"]{ background:var(--tint-red); color:var(--red); }
#fiche .f-why{ margin:-4px 0 4px; text-align:center; font-size:12.5px; color:var(--muted); }
#fiche .f-btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>

<script src="proto.js"></script>
<script>
(() => {
  const P = window.Proto;
  const PEOPLE = {
    leo: { name: 'Léo Bernard', first: 'Léo', handle: '@leo_bernard', vote: 'Non' },
    noah: { name: 'Noah Williams', first: 'Noah', handle: '@noah_williams', vote: 'Oui' },
    emma: { name: 'Emma Fischer', first: 'Emma', handle: '@emma_fischer', vote: 'Oui' },
    maya: { name: 'Maya Patel', first: 'Maya', handle: '@maya_patel', vote: 'Oui' },
    amir: { name: 'Amir Haddad', first: 'Amir', handle: '@amir_haddad', vote: 'Oui' },
  };
  const fiche = document.getElementById('fiche');
  const face = fiche.querySelector('.f-face');
  const vote = fiche.querySelector('.f-vote');
  let who = 'noah';
  const first = (w) => PEOPLE[w].first;
  const de = (w) => (/^[aeiouyàâéèêîôh]/i.test(first(w)) ? `d’${first(w)}` : `de ${first(w)}`);
  const live = (fn) => (b) => { if (!b.closest('[inert]')) fn(b); };

  P.actions.person = live((b) => {
    who = b.dataset.person;
    const p = PEOPLE[who];
    face.src = `img/58-face-${who}-${P.theme}.png`;
    face.alt = p.name;
    fiche.querySelector('h3').textContent = p.name;
    fiche.querySelector('.sub').textContent = p.handle;
    vote.textContent = `A voté ${p.vote}`;
    vote.dataset.camp = p.vote === 'Oui' ? 'oui' : 'non';
    P.openSheet(fiche);
    P.state(`Fiche ${de(who)} : ${p.first} a voté ${p.vote}. Tu le vois parce que c’est ton take.`);
  });
  P.actions.profile = () => {
    P.closeSheet();
    P.state(`Dans l’app : ouvre le profil ${de(who)}.`);
  };
  P.actions.write = live((b) => {
    const w = b.dataset.write || who;
    if (fiche.classList.contains('on')) P.closeSheet();
    P.state(`Dans l’app : ouvre la conversation avec ${first(w)}.`);
  });
  P.actions.anonymes = live(() => {
    P.toast('Les votes anonymes restent anonymes');
    P.state('Rien ne s’ouvre : ces 3 votes sont anonymes. Personne ne peut savoir qui a voté, pas même toi.');
  });

  const FILTERS = {
    tous: ['8 votes', 'Filtre « Tous » : les 8 votes, dont 3 en anonyme.'],
    oui: ['4 votes Oui', 'Filtre « Oui » : les 4 personnes qui ont voté Oui. Les votes anonymes ne sont dans aucun filtre.'],
    non: ['1 vote Non', 'Filtre « Non » : la personne qui a voté Non. Les votes anonymes ne sont dans aucun filtre.'],
  };
  P.actions.filter = (b) => {
    const f = b.dataset.filter;
    const sec = b.closest('section');
    sec.querySelectorAll('[data-filter]').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
    sec.querySelectorAll('.dlist .pr').forEach((row) => {
      const out = f !== 'tous' && row.dataset.camp !== f;
      row.classList.toggle('out', out);
      row.inert = out;
    });
    sec.querySelector('#dHead').textContent = FILTERS[f][0];
    P.state(FILTERS[f][1]);
  };

  P.actions.side = (b) => {
    const now = b.dataset.side;
    const sec = b.closest('section');
    sec.dataset.now = now;
    sec.querySelectorAll('[data-side]').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
    sec.querySelectorAll('.elist').forEach((list) => {
      const on = list.dataset.list === now;
      list.classList.toggle('on', on);
      list.inert = !on;
    });
    P.state(now === 'non' ? 'Onglet « Non · 1 » : Léo a voté Non.' : 'Onglet « Oui · 4 » : Noah, Emma, Maya et Amir ont voté Oui.');
  };

  document.querySelector('.dim').addEventListener('click', () => P.state('Fiche fermée.'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && fiche.classList.contains('on')) { P.closeSheet(); P.state('Fiche fermée.'); }
  });
})();
</script>
</body>
</html>
