<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)">
<title>Fluidité sur 3 jours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#F3F6FB;--surface:#FFFFFF;--surface-2:#E9EEF7;--ink:#141B2D;--muted:#55607A;--line:#DCE3EF;--line-2:#C6D0E2;
  --brand:#2A5BD7;--brand-dark:#1D43A8;--brand-soft:#E3EBFD;
  --ok:#21995A;--ok-dark:#187444;--ok-soft:#DFF4E8;--ok-ink:#16653B;
  --wait:#D9931C;--wait-dark:#A86F10;--wait-soft:#FCF0D8;--wait-ink:#7F530A;
  --bench:#7A4FD6;--bench-dark:#5B36AA;--bench-soft:#EEE7FC;--bench-ink:#4E2D99;
  --bad:#D9483B;--bad-dark:#A93329;--bad-soft:#FBE4E1;--bad-ink:#9A2C21;
  --z-mobile:#2A5BD7;--z-web:#E0752D;--z-api:#21995A;--z-outillage:#7A4FD6;--z-docs:#C9449A;--z-autre:#7C8798;
  --sans:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1420;--surface:#18202F;--surface-2:#222C3E;--ink:#EEF2FA;--muted:#A5B0C6;--line:#2A3446;--line-2:#3A4659;
  --brand:#7FA2F5;--brand-dark:#4F72C7;--brand-soft:#1B2944;
  --ok:#42BE7C;--ok-dark:#2B8A57;--ok-soft:#15372A;--ok-ink:#93E2B7;
  --wait:#E7B04F;--wait-dark:#B5852E;--wait-soft:#3A2E14;--wait-ink:#F3CF8C;
  --bench:#AE8DF0;--bench-dark:#8466C4;--bench-soft:#2A2147;--bench-ink:#D3C2F8;
  --bad:#EC6A5C;--bad-dark:#B8463B;--bad-soft:#3E201C;--bad-ink:#F7AEA4;
  --z-mobile:#7FA2F5;--z-web:#F09A5C;--z-api:#42BE7C;--z-outillage:#AE8DF0;--z-docs:#E57FBF;--z-autre:#9AA5B8;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4;font-weight:600;-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme:dark){body{font-weight:700}}
main{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.periode{margin:0;color:var(--muted);font-size:15px}
.msg{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-weight:800}
.table-wrap{background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line-2);overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;vertical-align:top;padding:12px 14px;overflow-wrap:anywhere}
thead th{color:var(--muted);font-size:14px;font-weight:900;border-bottom:2px solid var(--line)}
tbody tr+tr td{border-top:1px solid var(--line)}
td.endroit{width:44%;font-weight:900}
td.valeur{font-variant-numeric:tabular-nums}
.avant{color:var(--muted)}
.fleche{color:var(--muted);padding:0 4px}
.apres{color:var(--ok-ink);font-weight:900;white-space:nowrap}
@media (prefers-color-scheme:dark){.apres{color:var(--ok)}}
footer{color:var(--muted);font-size:14px;text-align:center}
footer a{color:var(--muted);font-weight:700}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1 id="titre">Fluidité sur 3 jours</h1>
  <p class="periode" id="periode"></p>
  <p class="msg" id="status" role="status" aria-live="polite">Chargement…</p>
  <button type="button" id="retry" hidden>Réessayer</button>
  <div class="table-wrap" id="results" hidden>
    <table>
      <thead><tr><th scope="col">Endroit</th><th scope="col">Avant → Après</th></tr></thead>
      <tbody id="lignes"></tbody>
    </table>
  </div>
  <footer><a href="details/index.html">Détails des mesures</a></footer>
</main>
<script>
(function(){
  'use strict';
  const status=document.getElementById('status'),retry=document.getElementById('retry'),results=document.getElementById('results');
  function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
  function render(data){
    document.getElementById('titre').textContent=data.titre;
    document.title=data.titre;
    document.getElementById('periode').textContent='Mesuré sur appareil, '+data.periode+'.';
    const body=document.getElementById('lignes');body.replaceChildren();
    for(const ligne of data.lignes){
      const tr=el('tr');
      tr.append(el('td','endroit',ligne.endroit));
      const v=el('td','valeur');
      const tenir=t=>t.replace(/(\d) (ms|s|sur|fois)\b/g,'$1\u00a0$2').replace(/ sur (\d)/g,'\u00a0sur\u00a0$1');
      v.append(el('span','avant',tenir(ligne.avant)),el('span','fleche','→'),el('span','apres',tenir(ligne.apres)));
      tr.append(v);body.append(tr);
    }
  }
  async function load(){
    retry.hidden=true;status.hidden=false;status.textContent='Chargement…';results.hidden=true;
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);
    try{
      const response=await fetch('fluidite-simple.json',{cache:'no-store',signal:controller.signal});
      if(!response.ok) throw new Error('http');
      const data=await response.json();
      if(!data||!Array.isArray(data.lignes)) throw new Error('data');
      render(data);results.hidden=false;status.hidden=true;
    }catch(error){
      status.textContent=controller.signal.aborted?'Le chargement est trop long. Vérifie la connexion, puis réessaie.':'Les mesures n\'ont pas pu se charger.';
      retry.hidden=false;
    }finally{clearTimeout(timer)}
  }
  retry.addEventListener('click',load);load();
})();
</script>
</body>
</html>
