<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)">
<title>Smoothness: what changed in 3 days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --bg:#F3F6FB;--surface:#FFFFFF;--surface-2:#E9EEF7;--ink:#141B2D;--muted:#55607A;--line:#DCE3EF;--line-2:#C6D0E2;
  --brand:#2A5BD7;--brand-dark:#1D43A8;--brand-soft:#E3EBFD;
  --ok:#21995A;--ok-dark:#187444;--ok-soft:#DFF4E8;--ok-ink:#16653B;
  --wait:#D9931C;--wait-dark:#A86F10;--wait-soft:#FCF0D8;--wait-ink:#7F530A;
  --bench:#7A4FD6;--bench-dark:#5B36AA;--bench-soft:#EEE7FC;--bench-ink:#4E2D99;
  --bad:#D9483B;--bad-dark:#A93329;--bad-soft:#FBE4E1;--bad-ink:#9A2C21;
  --z-mobile:#2A5BD7;--z-web:#E0752D;--z-api:#21995A;--z-outillage:#7A4FD6;--z-docs:#C9449A;--z-autre:#7C8798;
  --sans:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1420;--surface:#18202F;--surface-2:#222C3E;--ink:#EEF2FA;--muted:#A5B0C6;--line:#2A3446;--line-2:#3A4659;
  --brand:#7FA2F5;--brand-dark:#4F72C7;--brand-soft:#1B2944;
  --ok:#42BE7C;--ok-dark:#2B8A57;--ok-soft:#15372A;--ok-ink:#93E2B7;
  --wait:#E7B04F;--wait-dark:#B5852E;--wait-soft:#3A2E14;--wait-ink:#F3CF8C;
  --bench:#AE8DF0;--bench-dark:#8466C4;--bench-soft:#2A2147;--bench-ink:#D3C2F8;
  --bad:#EC6A5C;--bad-dark:#B8463B;--bad-soft:#3E201C;--bad-ink:#F7AEA4;
  --z-mobile:#7FA2F5;--z-web:#F09A5C;--z-api:#42BE7C;--z-outillage:#AE8DF0;--z-docs:#E57FBF;--z-autre:#9AA5B8;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;font-weight:600;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){body{font-weight:700}}
a{color:var(--brand);font-weight:800}
:focus-visible{outline:3px solid var(--wait);outline-offset:2px;border-radius:6px}
main{max-width:1440px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px;min-width:0}
h1,h2,h3,h4,p{margin:0}
h1{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h2{font-size:22px;font-weight:900;letter-spacing:-.01em;margin-bottom:12px;text-wrap:balance}
h3,h4{font-size:17px;font-weight:900;line-height:1.25}
section{min-width:0}
.top{display:flex;flex-direction:column;gap:8px;max-width:820px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:820px}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-size:34px;font-weight:900;line-height:1.05}
.kpi span{color:var(--muted);font-size:14px;line-height:1.25;overflow-wrap:normal;hyphens:manual}
.kpi.ok b{color:var(--ok)}.kpi.wait b{color:var(--wait-dark)}.kpi.bench b{color:var(--bench)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:900;margin-bottom:6px}
.badge.measured{background:var(--ok-soft);color:var(--ok-ink)}.badge.not_measured{background:var(--wait-soft);color:var(--wait-ink)}.badge.refused_then_fixed{background:var(--bench-soft);color:var(--bench-ink)}.badge.refused{background:var(--bad-soft);color:var(--bad-ink)}
.maj,.muted{color:var(--muted);font-size:16px}
.maj strong{color:var(--ink);font-weight:900}
.msg{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;font-size:18px;font-weight:800}
.notice{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;max-width:820px}
.notice p+p{margin-top:8px}
.table-wrap{background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line-2);padding:0 10px;min-width:0}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:15px}
caption{text-align:left;padding:14px 8px;font-size:16px;color:var(--muted)}
th,td{text-align:left;vertical-align:top;padding:12px 8px;min-width:0}
thead th{color:var(--muted);font-weight:900;border-bottom:2px solid var(--line)}
tbody+tbody .primary>*{border-top:2px solid var(--line)}
th[scope=row]{font-weight:900}
th[scope=row] time{display:block;color:var(--muted);font-size:14px;font-weight:700;margin-top:6px}
.value{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;font-variant-numeric:tabular-nums}
.device{margin-top:8px;color:var(--muted)}
.verdict{display:inline-block;background:var(--bench-soft);color:var(--bench-ink);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:900;max-width:100%}
.mobile-label{display:none}
.notes>td{padding-top:0;padding-bottom:16px}
.limits{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.limits b{font-weight:900}
.evidence{color:var(--muted);font-size:14px}
.measurements{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin-top:10px}
.measurement{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.measurement dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:8px 0 0}
.measurement dt{color:var(--muted);font-size:14px;font-weight:900}
.measurement dd{margin:3px 0 0;font-size:15px}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.carte{background:var(--surface);border:2px solid var(--line);border-left-width:6px;border-left-color:var(--wait);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.doubt{border-left-color:var(--bench)}
details{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 12px}
summary{cursor:pointer;min-height:48px;padding:12px 0;font-size:16px;font-weight:900}
summary:hover{color:var(--brand)}
details .measurement{margin-bottom:12px}
button{font:800 16px var(--sans);color:var(--brand);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation;align-self:flex-start;box-shadow:0 3px 0 var(--line-2)}
button:hover{border-color:var(--brand);background:var(--brand-soft)}
button:active{box-shadow:none;transform:translateY(2px)}
button:disabled{cursor:wait;opacity:.65}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:8px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;transform:translateY(-200%);z-index:2}
.skip:focus{transform:none}
footer{font-size:15px;color:var(--muted)}
@media (max-width:1099px){
  .table-wrap{border:0;background:transparent;box-shadow:none;padding:0}
  table,tbody,tr{display:block;width:100%}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  caption{display:block;padding:0 0 12px}
  colgroup{display:none}
  tbody{background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line-2);padding:14px;margin-bottom:14px;min-width:0}
  tbody:last-child{margin-bottom:0}
  tbody+tbody .primary>*{border-top:0}
  th[scope=row]{display:block;font-size:18px;padding:0 0 12px}
  .primary td{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .mobile-label{display:block;font-size:14px;color:var(--muted);font-weight:900}
  .notes td{display:block;padding:12px 0 0}
}
</style>
</head>
<body>
<a class="skip" href="#page">Skip to measurements</a>
<main id="page" tabindex="-1">
  <header class="top">
    <h1>Smoothness: what changed in 3 days</h1>
    <p>Merged changes, with their measurements and limits.</p>
  </header>
  <noscript><p class="msg">Turn on JavaScript, then reload to read the measurements.</p></noscript>
  <p class="msg" id="status" role="status" aria-live="polite">Loading measurements…</p>
  <button type="button" id="retry" hidden>Retry loading measurements</button>
  <div id="results" hidden></div>
</main>
<script>
(function(){
  'use strict';
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  const results = document.getElementById('results');
  const dateFormat = new Intl.DateTimeFormat('en-US', {
    timeZone:'Asia/Seoul',dateStyle:'medium',timeStyle:'short',hourCycle:'h23'
  });
  const numberFormat = new Intl.NumberFormat('en-US');
  function el(tag, cls, value){
    const node = document.createElement(tag);
    if(cls) node.className = cls;
    if(value !== undefined && value !== null) node.textContent = String(value);
    return node;
  }
  function time(iso){
    const node = el('time',null,dateFormat.format(new Date(iso))+' KST');
    node.dateTime = iso;
    node.title = iso;
    return node;
  }
  function pair(record){
    const block = el('div','measurement');
    block.append(el('h4','value',record.metric));
    const list = el('dl');
    for(const key of ['before','after']){
      const column = el('div');
      column.append(el('dt',null,key === 'before' ? 'Before' : 'After'),el('dd','value',record[key]));
      list.append(column);
    }
    block.append(list);
    return block;
  }
  function limits(item){
    const block = el('div','limits');
    const text = el('p');
    text.append(el('b',null,'Limits: '),document.createTextNode(item.caveat || 'No caveat supplied. Check the recorded method before drawing a conclusion.'));
    text.className = 'value';
    block.append(text);
    if(item.evidence_head){
      const revision = el('p','evidence value','Evidence revision: '+item.evidence_head);
      revision.setAttribute('translate','no');
      block.append(revision);
    }
    if(item.measurements && item.measurements.length){
      block.append(el('h3',null,'More measurements'));
      const pairs = el('div','measurements');
      for(const measurement of item.measurements) pairs.append(pair(measurement));
      block.append(pairs);
    }
    return block;
  }
  function section(title){
    const node = el('section');
    node.append(el('h2',null,title));
    return node;
  }
  function field(label,value){
    const cell = el('td');
    const mobileLabel = el('span','mobile-label',label);
    mobileLabel.setAttribute('aria-hidden','true');
    cell.append(mobileLabel,el('div','value',value));
    return cell;
  }
  function validate(data){
    if(!data || typeof data !== 'object') throw new Error('data');
    for(const key of ['generated_at','period_start','period_end']){
      if(typeof data[key] !== 'string' || !Number.isFinite(Date.parse(data[key]))) throw new Error('data');
    }
    if(!Number.isInteger(data.inventory_count) || data.inventory_count < 0) throw new Error('data');
    for(const key of ['improvements','left_out','doubts']) if(!Array.isArray(data[key])) throw new Error('data');
    for(const item of [...data.improvements,...data.left_out]){
      for(const key of ['merged_at','screen','what','metric','before','after','verdict','device','evidence_head','caveat']){
        if(typeof item[key] !== 'string') throw new Error('data');
      }
      if(!Number.isFinite(Date.parse(item.merged_at)) || !Number.isInteger(item.pr) || item.pr < 1) throw new Error('data');
      if(item.measurements !== undefined){
        if(!Array.isArray(item.measurements)) throw new Error('data');
        for(const measurement of item.measurements){
          if(!measurement || ['metric','before','after'].some(key=>typeof measurement[key] !== 'string')) throw new Error('data');
        }
      }
    }
    for(const item of data.left_out) if(typeof item.reason !== 'string') throw new Error('data');
    for(const item of data.doubts){
      if(!item || !Number.isInteger(item.pr) || item.pr < 1 || typeof item.reason !== 'string') throw new Error('data');
    }
    return data;
  }
  function render(data){
    const fragment = document.createDocumentFragment();
    const context = el('div','top');
    const updated = el('p','maj');
    updated.append(document.createTextNode('Updated '),time(data.generated_at));
    const period = el('p','maj');
    period.append(document.createTextNode('Period: '),time(data.period_start),document.createTextNode(' to '),time(data.period_end));
    context.append(updated,period,el('p','maj','Merged PRs reviewed: '+numberFormat.format(data.inventory_count)));
    if(typeof data.scope === 'string' && data.scope) context.append(el('p','value',data.scope));
    fragment.append(context);
    const count = status => data.improvements.filter(item => item.status === status).length;
    const kpis = el('div','kpis');
    kpis.setAttribute('aria-label','Summary');
    for(const [cls,value,label] of [
      ['ok',count('measured')+count('refused_then_fixed'),'measured on a device'],
      ['wait',count('not_measured'),'not measured yet'],
      ['bench',count('refused_then_fixed'),'refused first, then fixed'],
    ]){
      const kpi = el('p','kpi '+cls);
      kpi.append(el('b',null,numberFormat.format(value)),el('span',null,label));
      kpis.append(kpi);
    }
    fragment.append(kpis);
    const notice = el('aside','notice');
    notice.setAttribute('aria-label','How to read the evidence');
    notice.append(el('p',null,'Read each recorded verdict together with its device or tool and its limits.'),
      el('p','muted','A benchmark or a source check does not prove device smoothness. “Not measured on device” means device evidence is still missing.'));
    fragment.append(notice);
    const improvements = section('Mobile changes');
    const items = [...data.improvements].sort((a,b)=>a.screen.localeCompare(b.screen,'en') || Date.parse(a.merged_at)-Date.parse(b.merged_at));
    if(!items.length){
      improvements.append(el('p','msg','No mobile changes are listed for this period.'));
    }else{
      const wrap = el('div','table-wrap');
      const table = el('table');
      table.setAttribute('role','table');
      table.append(el('caption',null,'Sorted by screen, then merge date. Measurement text is shown as recorded.'));
      const columns = el('colgroup');
      for(const width of ['14%','22%','13%','15%','15%','15%','6%']){
        const column = el('col'); column.style.width = width; columns.append(column);
      }
      table.append(columns);
      const head = el('thead'); const headerRow = el('tr');
      for(const label of ['Screen / merge date','What changed','Metric','Before','After','Verdict / device or tool','PR']){
        const cell = el('th',null,label); cell.scope = 'col'; headerRow.append(cell);
      }
      head.append(headerRow);table.append(head);
      for(const item of items){
        const body = el('tbody'); body.setAttribute('role','rowgroup');
        const row = el('tr','primary');row.setAttribute('role','row');
        const screen = el('th');screen.scope='row';screen.setAttribute('role','rowheader');
        screen.append(el('span',null,item.screen),time(item.merged_at));
        const verdict = el('td');
        const mobileLabel = el('span','mobile-label','Verdict / method');mobileLabel.setAttribute('aria-hidden','true');
        const verdictText = el('div');
        if(item.status) verdictText.append(el('span','badge '+item.status,{measured:'Measured',not_measured:'Not measured',refused_then_fixed:'Refused, then fixed',refused:'Refused'}[item.status] || item.status));
        verdictText.append(el('span','verdict value',item.verdict),el('p','device value',item.device || 'Not measured on device'));
        verdict.append(mobileLabel,verdictText);
        row.append(screen,field('What changed',item.what),field('Metric',item.metric),field('Before',item.before),field('After',item.after),verdict,field('PR','#'+item.pr));
        for(const cell of row.children) if(cell.tagName==='TD') cell.setAttribute('role','cell');
        const notes = el('tr','notes');notes.setAttribute('role','row');
        const noteCell = el('td');noteCell.colSpan=7;noteCell.setAttribute('role','cell');
        noteCell.append(limits(item));notes.append(noteCell);
        body.append(row,notes);table.append(body);
      }
      wrap.append(table);improvements.append(wrap);
    }
    fragment.append(improvements);
    const leftOut = section('Refused on the last measurement');
    if(!data.left_out.length) leftOut.append(el('p','muted','No merged change has a refused last measurement.'));
    else{
      const list = el('ul','cards');
      for(const item of data.left_out){
        const card = el('li','carte');
        card.append(el('h3',null,item.screen+' · PR #'+item.pr),el('p','value',item.what),el('p','value','Reason: '+item.reason));
        const mergeDate=el('p','muted');mergeDate.append(time(item.merged_at));card.append(mergeDate);
        card.append(el('p','value',item.verdict+' · '+(item.device || 'Not measured on device')));
        const measurements = el('details');measurements.append(el('summary',null,'Recorded measurements'),pair(item));
        card.append(measurements,limits(item));list.append(card);
      }
      leftOut.append(list);
    }
    fragment.append(leftOut);
    const doubts = section('Open questions');
    if(!data.doubts.length) doubts.append(el('p','muted','No open questions are listed.'));
    else{
      const list = el('ul','cards');
      for(const item of data.doubts){
        const card=el('li','carte doubt');card.append(el('h3',null,'PR #'+item.pr),el('p','value',item.reason));list.append(card);
      }
      doubts.append(list);
    }
    fragment.append(doubts,el('footer',null,'This review records merged pull requests and the evidence supplied for each change.'));
    results.replaceChildren(fragment);
    results.style.display='flex';results.style.flexDirection='column';results.style.gap='26px';
  }
  async function load(){
    retry.hidden=true;retry.disabled=true;
    status.className='msg';status.setAttribute('role','status');status.setAttribute('aria-live','polite');
    status.textContent='Loading measurements…';results.hidden=true;
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),15000);
    try{
      const response=await fetch('fluidite.json',{cache:'no-store',signal:controller.signal});
      if(!response.ok) throw new Error('http');
      const data=validate(await response.json());
      render(data);results.hidden=false;
      status.textContent='Measurements loaded.';status.className='sr-only';
    }catch(error){
      status.setAttribute('role','alert');status.removeAttribute('aria-live');
      status.textContent=controller.signal.aborted
        ? 'Loading took too long. Check your connection, then retry.'
        : 'The measurements could not load. Check the data file, then retry.';
      retry.hidden=false;
    }finally{
      clearTimeout(timeout);retry.disabled=false;
    }
  }
  retry.addEventListener('click',load);
  load();
})();
</script>
</body>
</html>
